{% comment %} <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Property Form (Country-City-Area)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Poppins', sans-serif;
      padding-top: 40px;
    }
    .form-section {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      padding: 30px;
      transition: all 0.3s ease-in-out;
      max-width: 600px;
      margin: auto;
    }
    .form-section h4 {
      text-align: center;
      margin-bottom: 25px;
      color: #0d6efd;
      font-weight: 600;
    }
    .fade-in {
      animation: fadeIn 0.4s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="form-section">
      <h4>🏢 Property Submission Form</h4>

      <form id="dynamicForm" method="POST" action="#">
        <div class="mb-3">
          <label for="company" class="form-label fw-semibold">Select Company</label>
          <select id="company" name="company" class="form-select">
            <option value="">-- Choose Company --</option>
            <option value="Azizi">Azizi Developments</option>
            <option value="Emaar">Emaar Properties</option>
            <option value="DAMAC">DAMAC</option>
          </select>
        </div>

        <div id="fieldContainer" class="fade-in"></div>

        <div class="text-center mt-4">
          <button type="submit" class="btn btn-primary px-4 py-2">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Location data
    const locationData = {
      "UAE": {
        "Dubai": ["Downtown", "Jumeirah", "Marina"],
        "Abu Dhabi": ["Yas Island", "Saadiyat", "Reem Island"]
      },
      "India": {
        "Delhi": ["Connaught Place", "Dwarka", "Rohini"],
        "Mumbai": ["Andheri", "Bandra", "Colaba"]
      },
      "USA": {
        "New York": ["Manhattan", "Brooklyn", "Queens"],
        "California": ["Los Angeles", "San Francisco", "San Diego"]
      }
    };

    const fieldContainer = document.getElementById('fieldContainer');
    const companySelect = document.getElementById('company');

    companySelect.addEventListener('change', function() {
      const value = this.value;
      let html = "";

      // Common Location Dropdowns
      const locationHTML = `
        <h5 class="text-secondary mb-3">🌍 Location Details</h5>

        <div class="mb-3">
          <label class="form-label">Country</label>
          <select id="countrySelect" name="country" class="form-select">
            <option value="">-- Select Country --</option>
            ${Object.keys(locationData).map(c => `<option value="${c}">${c}</option>`).join('')}
            <option value="Other">Other</option>
          </select>
          <input type="text" id="countryOther" name="country_other" class="form-control mt-2 d-none" placeholder="Enter Country">
        </div>

        <div class="mb-3">
          <label class="form-label">City</label>
          <select id="citySelect" name="city" class="form-select" disabled>
            <option value="">-- Select City --</option>
          </select>
          <input type="text" id="cityOther" name="city_other" class="form-control mt-2 d-none" placeholder="Enter City">
        </div>

        <div class="mb-3">
          <label class="form-label">Area</label>
          <select id="areaSelect" name="area" class="form-select" disabled>
            <option value="">-- Select Area --</option>
          </select>
          <input type="text" id="areaOther" name="area_other" class="form-control mt-2 d-none" placeholder="Enter Area">
        </div>
      `;

      if (value === "Azizi") {
        html = `
          <div class="fade-in">
            <h5 class="text-secondary mb-3">🏗️ Azizi Project Details</h5>
            <div class="mb-3">
              <label class="form-label">Project Name</label>
              <input type="text" name="azizi_project_name" class="form-control" placeholder="Enter Project Name" required>
            </div>
            ${locationHTML}
            <div class="mb-3">
              <label class="form-label">Starting Price</label>
              <input type="number" name="azizi_price" class="form-control" placeholder="Enter Starting Price">
            </div>
          </div>`;
      } 
      else if (value === "Emaar") {
        html = `
          <div class="fade-in">
            <h5 class="text-secondary mb-3">🏠 Emaar Property Details</h5>
            <div class="mb-3">
              <label class="form-label">Property Title</label>
              <input type="text" name="emaar_title" class="form-control" placeholder="Enter Property Title" required>
            </div>
            ${locationHTML}
            <div class="mb-3">
              <label class="form-label">Price (AED)</label>
              <input type="number" name="emaar_price" class="form-control" placeholder="Enter Price">
            </div>
          </div>`;
      } 
      else if (value === "DAMAC") {
        html = `
          <div class="fade-in">
            <h5 class="text-secondary mb-3">🏢 DAMAC Agent Details</h5>
            <div class="mb-3">
              <label class="form-label">Agent Name</label>
              <input type="text" name="damac_agent" class="form-control" placeholder="Enter Agent Name" required>
            </div>
            ${locationHTML}
            <div class="mb-3">
              <label class="form-label">Commission (%)</label>
              <input type="number" name="damac_commission" class="form-control" placeholder="Enter Commission %">
            </div>
          </div>`;
      }

      fieldContainer.innerHTML = html;

      // Attach location event logic after form renders
      setupLocationLogic();
    });

    function setupLocationLogic() {
      const countrySelect = document.getElementById('countrySelect');
      const citySelect = document.getElementById('citySelect');
      const areaSelect = document.getElementById('areaSelect');

      const countryOther = document.getElementById('countryOther');
      const cityOther = document.getElementById('cityOther');
      const areaOther = document.getElementById('areaOther');

      // Country change
      countrySelect.addEventListener('change', function() {
        const country = this.value;
        citySelect.innerHTML = `<option value="">-- Select City --</option>`;
        areaSelect.innerHTML = `<option value="">-- Select Area --</option>`;
        citySelect.disabled = true;
        areaSelect.disabled = true;

        if (country === "Other") {
          countryOther.classList.remove("d-none");
          cityOther.classList.remove("d-none");
          areaOther.classList.remove("d-none");
        } else {
          countryOther.classList.add("d-none");
          cityOther.classList.add("d-none");
          areaOther.classList.add("d-none");
        }

        if (locationData[country]) {
          Object.keys(locationData[country]).forEach(city => {
            citySelect.innerHTML += `<option value="${city}">${city}</option>`;
          });
          citySelect.disabled = false;
          citySelect.innerHTML += `<option value="Other">Other</option>`;
        }
      });

      // City change
      citySelect.addEventListener('change', function() {
        const city = this.value;
        const country = countrySelect.value;
        areaSelect.innerHTML = `<option value="">-- Select Area --</option>`;
        areaSelect.disabled = true;

        if (city === "Other") {
          cityOther.classList.remove("d-none");
          areaOther.classList.remove("d-none");
        } else {
          cityOther.classList.add("d-none");
          areaOther.classList.add("d-none");
        }

        if (locationData[country] && locationData[country][city]) {
          locationData[country][city].forEach(area => {
            areaSelect.innerHTML += `<option value="${area}">${area}</option>`;
          });
          areaSelect.innerHTML += `<option value="Other">Other</option>`;
          areaSelect.disabled = false;
        }
      });

      // Area change
      areaSelect.addEventListener('change', function() {
        if (this.value === "Other") {
          areaOther.classList.remove("d-none");
        } else {
          areaOther.classList.add("d-none");
        }
      });
    }
  </script>
</body>
</html>  
   {% endcomment %}




<!DOCTYPE html>  
<html lang="en">  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
    {% comment %} <input type="text" id="searchBox" placeholder="Search location...">
    <div id="searchResults" class="dropdown-menu"></div>    

<script>
document.getElementById('searchBox').addEventListener('input', function() {
    let query = this.value.trim();
    if (query.length < 2) {
        document.getElementById('searchResults').style.display = 'none';
        return; // 2 letters ke baad search shuru ho
    }

    fetch(`/main/search-location/?q=${query}`)    
        .then(response => response.json())
        .then(data => {
            let html = '';
                
            if (data.countries.length) {
                html += '<h6 class="dropdown-header">Country</h6>';
                data.countries.forEach(item => {
                    html += `<div class="dropdown-item">${item.name}</div>`;
                });
            }

            if (data.cities.length) {
                html += '<h6 class="dropdown-header">City</h6>';
                data.cities.forEach(item => {
                    html += `<div class="dropdown-item">${item.name}, ${item.country}</div>`;
                });   
            }

            if (data.locations.length) {
                html += '<h6 class="dropdown-header">Location</h6>';
                data.locations.forEach(item => {
                    html += `<div class="dropdown-item">${item.name}, ${item.city}</div>`;
                });
            }

            document.getElementById('searchResults').innerHTML = html;
            document.getElementById('searchResults').style.display = 'block'; 
        });
});

// Dropdown item click
document.addEventListener('click', function(e) {
    if (e.target.classList.contains('dropdown-item')) {
        document.getElementById('searchBox').value = e.target.innerText;
        document.getElementById('searchResults').style.display = 'none';
    }
});
</script> {% endcomment %}





<div class="relative w-96 mx-auto mt-10">
  <input
    type="text"
    id="locationInput"
    placeholder="Search Location..."
    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-red-500 outline-none"
    autocomplete="off"
  />

  <!-- Filter Button -->  
  <button
    id="filterBtn"
    class="bg-red-600 text-white px-4 rounded-r-lg hover:bg-red-700"
  >
    Filter
  </button>   

  <!-- Dropdown -->

  <h2>Results</h2>  
  <div
    id="suggestionBox"
    class="absolute bg-white border border-gray-200 w-full mt-1 rounded-lg shadow-lg hidden z-50 max-h-64 overflow-y-auto"
  ></div>
</div>

<!-- ✅ Put your table BELOW the input box -->
<div class="container mx-auto mt-10">

  <h2>Propertyes</h2>  
  <table class="w-full border">
    <thead>
      <tr class="bg-gray-200">
        <th class="px-4 py-2">Image</th>
        <th class="px-4 py-2">Name</th>
        <th class="px-4 py-2">Address</th>
        <th class="px-4 py-2">Location</th>
        <th class="px-4 py-2">Agent</th>    
      </tr>
    </thead>

    <tbody id="tableBody">
      <!-- Dynamic rows will appear here -->
    </tbody>
  </table>
</div>        
<script>  
// AUTO DETECT CURRENT LOCATION  
function detectCurrentLocation() {
  if (!navigator.geolocation) {
    alert("Geolocation not supported");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      try {
        // YOUR BACKEND ENDPOINT (Reverse Geocode)
        const res = await fetch(`/main/reverse-location/?lat=${lat}&lon=${lon}`);
        const data = await res.json();

        if (data && data.label) {
          document.getElementById("locationInput").value = data.label;
        }
      } catch (error) {
        console.error("Reverse location failed");
      }
    },
    () => {
      alert("Failed to detect location.");
    }
  );
}

// ON PAGE LOAD: If input is empty → auto detect location
window.addEventListener("load", () => {
  const input = document.getElementById("locationInput");
  if (input.value.trim() === "") {
    detectCurrentLocation();
  }
});   



const input = document.getElementById("locationInput");
const suggestionBox = document.getElementById("suggestionBox");
let timeout = null;

input.addEventListener("input", function() {
  clearTimeout(timeout);
  const query = this.value.trim();

  if (query.length < 2) {
    suggestionBox.classList.add("hidden");
    return;
  }

  timeout = setTimeout(() => {         
    fetch(`/main/search-location/?q=${encodeURIComponent(query)}`)      
      .then(res => res.json())
      .then(data => {
        suggestionBox.innerHTML = "";
        if (!data.results.length) {
          suggestionBox.classList.add("hidden");
          return;
        }

        data.results.forEach(item => {
          const div = document.createElement("div");
          div.className =
            "px-4 py-2 hover:bg-gray-100 cursor-pointer flex flex-col";
          div.innerHTML = `
            <span class="text-red-600 font-medium">${item.label}</span>
            <span class="text-sm text-gray-500">${item.city ? item.city + ", " : ""}${item.country}</span>
          `;
          div.addEventListener("click", () => {
            input.value = item.label;
            suggestionBox.classList.add("hidden");
          });
          suggestionBox.appendChild(div);
        });

        suggestionBox.classList.remove("hidden");
      })
      .catch(() => suggestionBox.classList.add("hidden"));
  }, 400);
});




// For filer Data       

const filterBtn = document.getElementById("filterBtn");


filterBtn.addEventListener("click", function () {
    let location = input.value.trim();
    
    if (location === "") {
        alert("Please enter or select a location!");
        return;
    }

    // Fetch filtered data
    fetch(`/main/filter-by-location/?q=${encodeURIComponent(location)}`)
      .then(res => res.json())
      .then(data => {
        console.log("Filtered Results:", data);

        // Here update your table UI
        updateTable(data.results);
      })
      .catch(err => console.error(err));
});

// Update table dynamically
function updateTable(rows) {
    const tableBody = document.getElementById("tableBody");
    tableBody.innerHTML = "";

    rows.forEach(item => {
        let tr = document.createElement("tr");

        tr.innerHTML = `
            <td class="border px-4 py-2">
  <img 
    src="${item.image ? window.location.origin + item.image : '/static/no-image.png'}" 
    class="h-16 w-16 object-cover rounded"  
  />
</td>    

            <td class="border px-4 py-2">${item.name}</td>
            <td class="border px-4 py-2">${item.address}</td>
            <td class="border px-4 py-2">${item.location}</td>
            <td class="border px-4 py-2">${item.agent}</td>           
        `;

        tableBody.appendChild(tr);
    });
}
</script>        
   
</body>
</html>
