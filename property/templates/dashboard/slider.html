{% extends "dashboard/base.html" %}
{% load static %}

{% block title %} Slider {% endblock %}
      
      {% block content %}
      <!-- Include Quill CSS -->

      <main class="app-wrapper">
  <div class="container-fluid p-6">
      <div
            class="main-breadcrumb d-flex align-items-center my-3 position-relative"
          >
            <h2 class="breadcrumb-title mb-0 flex-grow-1 fs-14">Add Slider</h2>
            <div class="flex-shrink-0">
              <nav aria-label="breadcrumb">
                <ol class="breadcrumb justify-content-end mb-0">
                  <li class="breadcrumb-item">
                    <a href="{% url 'view_slider' %}" class="btn btn-primary" style="color:#fff">View Sliders</a>
                  </li>
                 
                </ol>
              </nav>
            </div>
          </div>
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-header">
          </div>
          <div class="card-body">
             <form action="" method="post" enctype="multipart/form-data">
  {% csrf_token %}

           
                
              <div class="row">
                 <div class="col-md-12">
                  <div class="mb-3">
                    <label for="name" class="form-label">Title</label>
                    <input type="text" class="form-control" id="name" name="title" value="{{ row.title|default:'' }}" required>
                  </div>
                </div>
               
              
              </div>
              <div class="row">
               <div class="col-12">
  <div class="mb-3">
    <label for="imageUpload" class="form-label">Upload Image</label>
    <input type="file" class="form-control" id="imageUpload" name="imageUpload" accept="image/*">

    {% if row.image %}
      <div class="mt-2">
        <p class="mb-1">Current Image:</p>
        <img src="{{ row.image.url }}" alt="Profile Image" width="120" class="rounded shadow-sm">
      </div>
    {% endif %}
  </div>
</div>
              
<div class="col-md-12">
  <div class="mb-3">
    <label for="paragraph" class="form-label">Description</label>
    <textarea
      class="form-control"
      id="paragraph"
      name="paragraph"
      rows="4"
      placeholder="Enter up to 10 words..."
    >{{ row.paragraph|default:'' }}</textarea>
    <small class="text-muted" id="wordCount">0 / 10 words</small>
  </div>
</div>






              </div>
              <div class="row">
                <div class="col-12">
                 <button type="submit" class="btn btn-primary">
  {% if row %} Update {% else %} Submit {% endif %}
</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
<!-- Include Quill JS -->
<script>
const textarea = document.getElementById('paragraph');
const wordCountDisplay = document.getElementById('wordCount');
const maxWords = 10;

function countWords(text) {
    let words = text.trim().replace(/\s+/g, ' ').split(' ');
    if (words[0] === '') return 0; // handle empty textarea
    return words.length;
}

// Update word count
function updateWordCount() {
    let words = textarea.value.trim().replace(/\s+/g, ' ').split(' ');
    if (words[0] === '') words = [];
    wordCountDisplay.textContent = `${words.length} / ${maxWords} words`;
}

// Prevent typing beyond max words
textarea.addEventListener('keypress', function(e) {
    let wordCount = countWords(textarea.value);
    if (wordCount >= maxWords && e.key !== 'Backspace' && e.key !== 'Delete') {
        e.preventDefault(); // block further typing
    }
});

// Prevent pasting text that exceeds the limit
textarea.addEventListener('paste', function(e) {
    e.preventDefault();
    let paste = (e.clipboardData || window.clipboardData).getData('text');
    let words = textarea.value.trim().replace(/\s+/g, ' ').split(' ');
    if (words[0] === '') words = [];
    let remaining = maxWords - words.length;
    let pasteWords = paste.trim().split(/\s+/).slice(0, remaining);
    if (pasteWords.length > 0) {
        textarea.value += (words.length ? ' ' : '') + pasteWords.join(' ');
    }
    updateWordCount();
});

// Update counter on typing
textarea.addEventListener('input', updateWordCount);

// Initialize counter
updateWordCount();
</script>
{% endblock content %}
