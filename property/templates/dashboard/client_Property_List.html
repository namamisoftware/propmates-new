{% extends "dashboard/base.html" %}
{% load static %}

{% block title %} Register User {% endblock %}
      
{% block content %}
<main class="app-wrapper">
  <div class="container-fluid">
      <!-- 🔹 Top Navigation Bar for Properties Page -->
<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 my-3 border-bottom pb-3">

  <!-- 🔸 Left: Title -->
  <div class="flex-shrink-0">
    <h2 class="breadcrumb-title mb-0 fs-5 fw-bold">Properties</h2>  
  </div>

  <!-- 🔸 Center: Search & Filter -->
  <div class="flex-grow-1 d-flex justify-content-center">
    <form method="get" class="d-flex align-items-center gap-3">
      <input 
        type="text" 
        name="q" 
        class="form-control" 
        placeholder="🔍 Search by title..." 
        value="{{ search }}" 
        style="min-width: 250px; height: 44px;"
      >
      <select name="category" class="form-select" style="min-width: 180px; height: 44px;">
        <option value="">All Categories</option>
        <option value="residential" {% if category == "residential" %}selected{% endif %}>Residential</option>
        <option value="commercial" {% if category == "commercial" %}selected{% endif %}>Commercial</option>
      </select>
      <button class="btn btn-primary px-4" style="height: 44px;">Search</button>
    </form>
  </div>

  <!-- 🔸 Right: Add Buttons -->
  <div class="d-flex align-items-center gap-2 flex-shrink-0">
    <a href="{% url 'add_property_wizard' %}" class="btn btn-primary text-white px-4 py-2">
      + Add New Property
    </a>
    <a href="{% url 'add_property' %}" class="btn btn-success text-white px-4 py-2">
      Add Simple Property
    </a>
  </div>

</div>  

    </div>
    
    <h1>{{client}}</h1> 
    
    

{% endblock content %}
