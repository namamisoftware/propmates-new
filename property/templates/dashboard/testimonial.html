{% extends "dashboard/base.html" %}
{% load static %}

{% block title %} Testimonial {% endblock %}
      
      {% block content %}
      <main class="app-wrapper">
  <div class="container-fluid p-6">
      <div
            class="main-breadcrumb d-flex align-items-center my-3 position-relative"
          >
            <h2 class="breadcrumb-title mb-0 flex-grow-1 fs-14">Add Testimonial</h2>
            <div class="flex-shrink-0">
              <nav aria-label="breadcrumb">
                <ol class="breadcrumb justify-content-end mb-0">
                  <li class="breadcrumb-item">
                    <a href="{% url 'view_testimonial' %}" class="btn btn-primary" style="color:#fff">View Testimonials</a>
                  </li>
                 
                </ol>
              </nav>
            </div>
          </div>
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-header">
          </div>
          <div class="card-body">
             <form action="" method="post" enctype="multipart/form-data">
  {% csrf_token %}

              <div class="row">
                <div class="col-md-6">
                  <div class="mb-3">
                    <label for="name" class="form-label">Title</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ row.name|default:'' }}" required>
                  </div>
                </div>   
                <div class="col-md-6">
                  <div class="mb-3">
                    <label for="link" class="form-label">Link</label>
                    <input type="url" class="form-control" id="link" name="message" value="{{ row.message|default:'' }}" required>
                  </div>
                </div> 
              </div>
              <div class="row">
                <div class="col-12">
                 <button type="submit" class="btn btn-primary">
  {% if row %} Update {% else %} Submit {% endif %}
</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock content %}
