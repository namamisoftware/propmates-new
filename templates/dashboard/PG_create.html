<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create PG Property</title>
    <meta charset="UTF-8">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        #map {
            height: 300px;
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }
        .suggest-box { max-height: 200px; overflow-y: auto; }
    </style>

</head>

<body class="bg-gray-100 p-6">

<div class="max-w-5xl mx-auto bg-white rounded-2xl p-8 shadow-lg">

    <h1 class="text-2xl font-bold mb-6">Create PG Property</h1>

    <form id="pgForm" method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- STEP 1: Property Details -->
        <h2 class="text-xl font-semibold mb-4">Step 1: Property Details</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
               <div>
                    <label>Title</label>
                    <input type="text" name="title" class="w-full border p-2 rounded">
                </div>  
            <div>
                <label class="font-medium">Room Type</label>
                <select name="room_type" class="border px-3 py-2 rounded-lg w-full">
                    <option>Single</option>
                    <option>Double</option>
                    <option>Shared</option>
                </select>
            </div>

            <div>
                <label class="font-medium">Furnishing</label>
                <select name="furnishing" class="border px-3 py-2 rounded-lg w-full">
                    <option>Fully Furnished</option>
                    <option>Semi Furnished</option>
                    <option>Unfurnished</option>
                </select>
            </div>

            <div>
                <label class="font-medium">Preferred Gender</label>
                <select name="preferred_gender" class="border px-3 py-2 rounded-lg w-full">
                    <option>Male</option>
                    <option>Female</option>
                    <option>Any</option>
                </select>
            </div>

            <div>
                <label class="font-medium">Minimum Stay (months)</label>
                <input type="number" name="minimum_stay" class="border px-3 py-2 rounded-lg w-full">
            </div>

            <div>
                <label class="font-medium">Total Beds</label>
                <input type="number" name="total_beds" class="border px-3 py-2 rounded-lg w-full" value="1">
            </div>

        </div>

        <!-- Property Type -->
        <div class="mb-3">
            <label class="form-label">Property Type</label>
            <select name="property_type" class="form-select">       
                {% for type in property_types %}    
                    <option value="{{ type.id }}">{{ type.name }}</option>    
                {% endfor %}  
            </select>    
        </div>  

        <div>
            <select name="company" class="form-control">
               <option value="">Select Company</option>
              {% for c in company %}
                <option value="{{ c.id }}">{{ c.name }}</option>
              {% endfor %}
            </select>    
        </div>    


        <!-- BOOLEAN OPTIONS -->
        <h3 class="text-lg font-semibold mt-6 mb-3">Facilities</h3>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <label><input type="checkbox" name="attached_bathroom"> Attached Bathroom</label>
            <label><input type="checkbox" name="kitchen_access"> Kitchen Access</label>
            <label><input type="checkbox" name="laundry_access"> Laundry Access</label>
        </div>

        <!-- Utilities -->
        <h3 class="text-lg font-semibold mt-6 mb-3">Included Utilities</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <label><input type="checkbox" name="electricity"> Electricity</label>
            <label><input type="checkbox" name="water"> Water</label>
            <label><input type="checkbox" name="wifi"> Wi-Fi</label>
            <label><input type="checkbox" name="cleaning"> Cleaning</label>
        </div>

        <!-- Pricing -->
        <h2 class="text-xl font-semibold mt-6 mb-4">Pricing</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="font-medium">Currency</label>
                <input type="text" name="currency" class="border px-3 py-2 rounded-lg w-full" value="INR">
            </div>

            <div>
                <label class="font-medium">Expected Monthly Price</label>
                <input type="number" name="expected_price" class="border px-3 py-2 rounded-lg w-full">
            </div>
        </div>

        <div class="mt-4">
            <label class="font-medium">Description</label>
            <textarea name="description" class="border px-3 py-2 rounded-lg w-full h-24"></textarea>
        </div>


        <!-- LOCATION -->
        <h2 class="text-xl font-semibold mt-6 mb-3">Step 2: Location</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

            <div>
                <label class="font-medium">Country</label>
                <select id="country" name="country" class="w-full border p-2 rounded"></select>  
            </div>

            <div>
                <label class="font-medium">State</label>  
                <select id="state" name="state" class="w-full border p-2 rounded"></select>
            </div>

            <div>  
                <label class="font-medium">City</label>
                <select id="city" name="city" class="w-full border p-2 rounded"></select>
            </div>

            <div class="relative">
                <label class="font-medium">Locality</label>
                <input type="text" id="locality" name="locality" class="border px-3 py-2 rounded-lg w-full">
                <div id="locality_suggest" class="absolute left-0 right-0 bg-white border rounded-lg shadow hidden suggest-box z-10"></div>
            </div>

            <div>
                <label class="font-medium">Landmark</label>
                <input type="text" name="landmark" class="border px-3 py-2 rounded-lg w-full">
            </div>

            <div>
                <label class="font-medium">Pincode</label>
                <input type="text" name="pincode" class="border px-3 py-2 rounded-lg w-full">
            </div>

        </div>

        <!-- MAP -->
        <div class="mt-4">
            <label class="font-medium">Select Location on Map</label>
            <div id="map"></div>  

            <input type="hidden" name="latitude" id="lat">
            <input type="hidden" name="longitude" id="lng">
        </div>
        
  <!-- LAT / LNG -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">

    <!-- Latitude -->
    <div>
        <label class="font-medium">Latitude</label>
        <div class="flex mt-1">
            <input 
                type="text"
                id="latitude"
                name="latitude"
                class="border rounded-l-lg px-3 py-2 w-full"
                placeholder="Enter latitude"
            >
            <button 
                type="button"
                id="setLatLng"
                class="border border-blue-600 text-blue-600 px-4 rounded-r-lg"
            >
                Set
            </button>
        </div>
    </div>

    <!-- Longitude -->
    <div>
        <label class="font-medium">Longitude</label>
        <div class="flex mt-1">
            <input 
                type="text"
                id="longitude"
                name="longitude"
                class="border rounded-l-lg px-3 py-2 w-full"
                placeholder="Enter longitude"
            >
            <button 
                type="button"
                id="getCurrentLocation"
                class="border border-green-600 text-green-600 px-4 rounded-r-lg"
            >
                Current
            </button>
        </div>
    </div>

</div>

<!-- Selected Address -->
<div class="mt-6">
    <label class="font-medium">Selected Address</label>
    <input 
        type="text"
        id="address"
        name="address"
        class="border rounded-lg px-3 py-2 mt-1 w-full"
        placeholder="Address will appear here"
    >
</div>     









        <!-- AMENITIES -->
        <h2 class="text-xl font-semibold mt-6 mb-2">Amenities</h2>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
            {% for a in amenities %}
                <label>
                    <input type="checkbox" name="amenities" value="{{ a.id }}"> {{ a.name }}
                </label>
            {% endfor %}
        </div>


        <!-- IMAGES -->
        <h2 class="text-xl font-semibold mt-6 mb-3">Images</h2>

        <label class="border-2 border-dashed rounded-lg p-6 text-center cursor-pointer block">
            <div class="text-4xl text-gray-400">+</div>
            <p class="text-gray-600">Click to upload images</p>
            <input type="file" name="images" multiple class="hidden">  
        </label>

        <!-- 360 images -->
        <h2 class="text-xl font-semibold mt-6 mb-3">360° Images</h2>

        <label class="border-2 border-dashed rounded-lg p-6 text-center cursor-pointer block">
            <div class="text-4xl text-gray-400">🌀</div>
            <p class="text-gray-600">Upload 360° Images</p>
            <input type="file" name="images_360" multiple class="hidden">  
        </label>    

        <!-- VIDEO -->
        <h2 class="text-xl font-semibold mt-6 mb-3">Video (Optional)</h2>

        <label class="border-2 border-dashed rounded-lg p-6 text-center cursor-pointer block">
            <div class="text-4xl text-gray-400">🎥</div>
            <p class="text-gray-600">Click to upload video</p>
            <input type="file" name="video_file" class="hidden">  
        </label>

        <div class="mt-3">
            <label class="font-medium">Video URL</label>
            <input type="url" name="video_url" class="border px-3 py-2 rounded-lg w-full">
        </div>

        <!-- SUBMIT -->
        <button class="mt-6 bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
            Submit Property
        </button>

    </form>

</div>



<!-- JS -->
<script>


    
        /* ------------------- COUNTRY / STATE / CITY ------------------- */
        const country = document.getElementById("country");
        const state = document.getElementById("state");
        const city = document.getElementById("city");

        country.innerHTML = `<option>Loading...</option>`;

        fetch("https://countriesnow.space/api/v0.1/countries")
            .then(r => r.json())
            .then(data => {
                country.innerHTML = `<option value="">Select Country</option>`;
                data.data.forEach(c => {
                    country.innerHTML += `<option value="${c.country}">${c.country}</option>`;
                });
            });

        country.addEventListener("change", () => {
            state.innerHTML = `<option>Loading...</option>`;

            fetch("https://countriesnow.space/api/v0.1/countries/states", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ country: country.value })
            })
                .then(r => r.json())
                .then(data => {
                    state.innerHTML = `<option value="">Select State</option>`;
                    data.data.states.forEach(s => {
                        state.innerHTML += `<option value="${s.name}">${s.name}</option>`;
                    });
                });
        });

        state.addEventListener("change", () => {
            city.innerHTML = `<option>Loading...</option>`;

            fetch("https://countriesnow.space/api/v0.1/countries/state/cities", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    country: country.value,
                    state: state.value
                })
            })
                .then(r => r.json())
                .then(data => {
                    city.innerHTML = `<option value="">Select City</option>`;
                    data.data.forEach(ct => {
                        city.innerHTML += `<option value="${ct}">${ct}</option>`;
                    });
                });
        });  



    // 🌍 MAP INIT
    var map = L.map('map').setView([20.5937, 78.9629], 5);  // India Center

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
    }).addTo(map);

    var marker;

    map.on("click", function(e) {
        let lat = e.latlng.lat;
        let lng = e.latlng.lng;

        document.getElementById("lat").value = lat;
        document.getElementById("lng").value = lng;

        if (marker) map.removeLayer(marker);

        marker = L.marker([lat, lng]).addTo(map);
    });


    // 🔍 Locality Suggestion
    document.getElementById("locality").addEventListener("input", function() {
        let val = this.value;

        if (val.length < 3) {
            document.getElementById("locality_suggest").classList.add("hidden");
            return;
        }

        fetch(`/location/search/?q=${val}`)
            .then(res => res.json())
            .then(data => {
                let box = document.getElementById("locality_suggest");
                box.innerHTML = "";

                data.cities.forEach(city => {
                    let div = document.createElement("div");
                    div.className = "p-2 hover:bg-gray-100 cursor-pointer";
                    div.innerText = city;
                    div.onclick = () => {
                        document.getElementById("locality").value = city;
                        box.classList.add("hidden");
                    };
                    box.appendChild(div);
                });

                box.classList.remove("hidden");
            });
    });
</script>

</body>    
</html>
