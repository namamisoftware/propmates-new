<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create Business For Sale</title>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        #map { height: 300px; width: 100%; border-radius: 12px; }
        .suggest-box { max-height: 200px; overflow-y: auto; }
    </style>
</head>

<body class="bg-gray-100 p-6">
<div class="max-w-5xl mx-auto bg-white p-8 rounded-2xl shadow-lg">

    <h1 class="text-2xl font-bold mb-6">Business For Sale – Create Listing</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- BASIC DETAILS -->
        <h2 class="text-xl font-semibold mb-4">Business Details</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

            <div>
                <label class="font-medium">Business Title</label>
                <input type="text" name="title" class="border px-3 py-2 rounded-lg w-full">
            </div>

            <div>
                <label class="font-medium">Business Type</label>
                <select name="business_type" class="border px-3 py-2 rounded-lg w-full">
                    <option value="restaurant">Restaurant / Café</option>
                    <option value="shop">Retail Shop</option>
                    <option value="manufacturing">Manufacturing Unit</option>
                    <option value="it_company">IT Company</option>
                    <option value="hotel">Hotel / Lodge</option>
                    <option value="salon">Salon / Spa</option>
                    <option value="gym">Gym / Fitness</option>
                    <option value="other">Other</option>
                </select>
            </div>

             <div>
            <select name="company" class="form-control">
               <option value="">Select Company</option>
              {% for c in company %}
                <option value="{{ c.id }}">{{ c.name }}</option>
              {% endfor %}
            </select>  
        </div>   

            <div>
                <label class="font-medium">Established Year</label>
                <input type="number" name="established_year" class="border px-3 py-2 rounded-lg w-full">
            </div>

            <div>
                <label class="font-medium">Asking Price</label>
                <input type="number" name="asking_price" class="border px-3 py-2 rounded-lg w-full">
            </div>

            <div class="flex items-center gap-2">
                <input type="checkbox" name="price_negotiable">
                <label>Price Negotiable</label>
            </div>

            <div>
                <label class="font-medium">Monthly Revenue</label>
                <input type="number" name="monthly_revenue" class="border px-3 py-2 rounded-lg w-full">
            </div>

            <div>
                <label class="font-medium">Profit Margin (%)</label>
                <input type="text" name="profit_margin" class="border px-3 py-2 rounded-lg w-full">
            </div>

            <div>
                <label class="font-medium">Number of Employees</label>
                <input type="number" name="number_of_employees" class="border px-3 py-2 rounded-lg w-full">
            </div>

            <div>
                <label class="font-medium">Total Area</label>
                <input type="number" name="total_area" class="border px-3 py-2 rounded-lg w-full">
            </div>

            <div>
                <label class="font-medium">Ownership Type</label>
                <input type="text" name="ownership_type" class="border px-3 py-2 rounded-lg w-full">
            </div>

        </div>

        <div class="mt-4">
            <label class="font-medium">Business Description</label>
            <textarea name="description" class="border px-3 py-2 rounded-lg w-full h-28"></textarea>
        </div>

        <div class="mt-4">
            <label class="font-medium">Facilities Included</label>
            <textarea name="facilities_included" class="border px-3 py-2 rounded-lg w-full h-20"></textarea>
        </div>

        <div class="mt-4">
            <label class="font-medium">Reason for Sale</label>
            <textarea name="reason_for_sale" class="border px-3 py-2 rounded-lg w-full h-20"></textarea>
        </div>

        <!-- CONTACT DETAILS -->
        <h2 class="text-xl font-semibold mt-6 mb-4">Contact Information</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="font-medium">Contact Person</label>
                <input type="text" name="contact_person" class="border px-3 py-2 rounded-lg w-full">
            </div>

            <div>
                <label class="font-medium">Phone</label>
                <input type="text" name="contact_phone" class="border px-3 py-2 rounded-lg w-full">
            </div>

            <div class="md:col-span-2">
                <label class="font-medium">Email</label>
                <input type="email" name="contact_email" class="border px-3 py-2 rounded-lg w-full">
            </div>
        </div>

         <!-- Property Type -->
        <div class="mb-3">
            <label class="form-label">Property Type</label>
            <select name="property_type" class="form-select">    
                {% for type in property_types %}  
                    <option value="{{ type.id }}">{{ type.name }}</option>  
                {% endfor %}
            </select>  
        </div>    

        <!-- LOCATION -->
        <h2 class="text-xl font-semibold mt-6 mb-4">Location Details</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

           <div>
                <label class="font-medium">Country</label>
                <select id="country" name="country" class="w-full border p-2 rounded"></select>  
            </div>

            <div>
                <label class="font-medium">State</label>  
                <select id="state" name="state" class="w-full border p-2 rounded"></select>
            </div>

            <div>  
                <label class="font-medium">City</label>
                <select id="city" name="city" class="w-full border p-2 rounded"></select>
            </div>

            <div class="relative">
                <label class="font-medium">Locality</label>
                <input type="text" id="locality" name="locality" class="border px-3 py-2 rounded-lg w-full">
                <div id="locality_suggest" class="absolute left-0 right-0 bg-white border rounded-lg shadow hidden suggest-box z-10"></div>
            </div>

            <div class="md:col-span-2">
                <label class="font-medium">Full Address</label>
                <textarea name="address" class="border px-3 py-2 rounded-lg w-full h-20"></textarea>
            </div>

            <div>
                <label class="font-medium">Landmark</label>
                <input type="text" name="landmark" class="border px-3 py-2 rounded-lg w-full">
            </div>

            <div>
                <label class="font-medium">Pincode</label>
                <input type="text" name="pincode" class="border px-3 py-2 rounded-lg w-full">
            </div>
        </div>

        <!-- MAP -->
        <div class="mt-4">
            <label class="font-medium">Select Location on Map</label>
            <div id="map"></div>
            <input type="hidden" id="lat" name="latitude">
            <input type="hidden" id="lng" name="longitude">
        </div>
   <!-- LAT / LNG -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">

    <!-- Latitude -->
    <div>
        <label class="font-medium">Latitude</label>
        <div class="flex mt-1">
            <input 
                type="text"
                id="latitude"
                name="latitude"
                class="border rounded-l-lg px-3 py-2 w-full"
                placeholder="Enter latitude"
            >
            <button 
                type="button"
                id="setLatLng"
                class="border border-blue-600 text-blue-600 px-4 rounded-r-lg"
            >
                Set
            </button>
        </div>
    </div>

    <!-- Longitude -->
    <div>
        <label class="font-medium">Longitude</label>
        <div class="flex mt-1">
            <input 
                type="text"
                id="longitude"
                name="longitude"
                class="border rounded-l-lg px-3 py-2 w-full"
                placeholder="Enter longitude"
            >
            <button 
                type="button"
                id="getCurrentLocation"
                class="border border-green-600 text-green-600 px-4 rounded-r-lg"
            >
                Current
            </button>
        </div>
    </div>

</div>  





        <!-- AMENITIES -->
        <h2 class="text-xl font-semibold mt-6 mb-4">Amenities</h2>

        <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
            {% for a in amenities %}
                <label><input type="checkbox" name="amenities" value="{{ a.id }}"> {{ a.name }}</label>
            {% endfor %}
        </div>

        <!-- IMAGES -->
        <h2 class="text-xl font-semibold mt-6 mb-3">Business Images</h2>

        <label class="border-2 border-dashed rounded-lg p-6 text-center cursor-pointer block">
            <div class="text-4xl text-gray-400">+</div>
            <p class="text-gray-600">Upload Business Images</p>
            <input type="file" name="images" multiple class="hidden">
        </label>

        <!-- 360 images -->
        <h2 class="text-xl font-semibold mt-6 mb-3">360° Images</h2>

        <label class="border-2 border-dashed rounded-lg p-6 text-center cursor-pointer block">
            <div class="text-4xl text-gray-400">🌀</div>
            <p class="text-gray-600">Upload 360° Images</p>
            <input type="file" name="images_360" multiple class="hidden">
        </label>

        <!-- VIDEO -->
        <h2 class="text-xl font-semibold mt-6 mb-3">Business Video (Optional)</h2>

        <label class="border-2 border-dashed rounded-lg p-6 text-center cursor-pointer block">
            <div class="text-4xl text-gray-400">🎥</div>
            <p class="text-gray-600">Upload Video File</p>
            <input type="file" name="video_file" class="hidden">
        </label>

        <div class="mt-3">
            <label class="font-medium">Video URL</label>
            <input type="url" name="video_url" class="border px-3 py-2 rounded-lg w-full">
        </div>

        <!-- SUBMIT -->
        <button class="mt-6 bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
            Submit Business
        </button>

    </form>

</div>

<script>

   
    
        /* ------------------- COUNTRY / STATE / CITY ------------------- */
        const country = document.getElementById("country");
        const state = document.getElementById("state");
        const city = document.getElementById("city");

        country.innerHTML = `<option>Loading...</option>`;

        fetch("https://countriesnow.space/api/v0.1/countries")
            .then(r => r.json())
            .then(data => {
                country.innerHTML = `<option value="">Select Country</option>`;
                data.data.forEach(c => {
                    country.innerHTML += `<option value="${c.country}">${c.country}</option>`;
                });
            });

        country.addEventListener("change", () => {
            state.innerHTML = `<option>Loading...</option>`;

            fetch("https://countriesnow.space/api/v0.1/countries/states", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ country: country.value })
            })
                .then(r => r.json())
                .then(data => {
                    state.innerHTML = `<option value="">Select State</option>`;
                    data.data.states.forEach(s => {
                        state.innerHTML += `<option value="${s.name}">${s.name}</option>`;
                    });
                });
        });

        state.addEventListener("change", () => {
            city.innerHTML = `<option>Loading...</option>`;

            fetch("https://countriesnow.space/api/v0.1/countries/state/cities", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    country: country.value,
                    state: state.value
                })
            })
                .then(r => r.json())
                .then(data => {
                    city.innerHTML = `<option value="">Select City</option>`;
                    data.data.forEach(ct => {
                        city.innerHTML += `<option value="${ct}">${ct}</option>`;
                    });
                });
        });    




    // MAP INIT
    var map = L.map('map').setView([20.5937, 78.9629], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    var marker;

    map.on("click", function(e) {
        const lat = e.latlng.lat;
        const lng = e.latlng.lng;

        document.getElementById("lat").value = lat;
        document.getElementById("lng").value = lng;

        if (marker) map.removeLayer(marker);

        marker = L.marker([lat, lng]).addTo(map);
    });

    // Locality Suggest
    document.getElementById("locality").addEventListener("input", function () {
        let val = this.value;

        if (val.length < 3) {
            document.getElementById("locality_suggest").classList.add("hidden");
            return;
        }

        fetch(`/location/search/?q=${val}`)
            .then(res => res.json())
            .then(data => {
                let box = document.getElementById("locality_suggest");
                box.innerHTML = "";

                data.cities.forEach(city => {
                    let div = document.createElement("div");
                    div.className = "p-2 hover:bg-gray-100 cursor-pointer";
                    div.innerText = city;

                    div.onclick = () => {
                        document.getElementById("locality").value = city;
                        box.classList.add("hidden");
                    };

                    box.appendChild(div);
                });

                box.classList.remove("hidden");
            });
    });
</script>
</body>
</html>
