{% extends "dashboard/base.html" %}
{% load static %}

{% block title %} Amenity {% endblock %}
      
      {% block content %}
       <main class="app-wrapper">
  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <div class="card mt-6">
          <div class="card-header">
            <h5 class="card-title mb-0">Amenity Information</h5>
          </div>
          <div class="card-body">
            <form action="" method="post" enctype="multipart/form-data">
  {% csrf_token %}

              <div class="row">
                <div class="col-md-6">
                  <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ row.name|default:'' }}" required>
                  </div>
                </div>
               
              </div>
               <div class="row">
                <div class="col-12">
                 <button type="submit" class="btn btn-primary">
  {% if row %} Update {% else %} Submit {% endif %}
</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock content %}
