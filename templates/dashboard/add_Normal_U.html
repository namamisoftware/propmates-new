{% extends "dashboard/base.html" %}
{% load static %}

{% block title %} Our Team {% endblock %}
      
{% block content %}
<main class="app-wrapper">
  <div class="container-fluid p-6">
    <div class="main-breadcrumb d-flex align-items-center my-3 position-relative">
      <h2 class="breadcrumb-title mb-0 flex-grow-1 fs-14">Members</h2>
      <div class="flex-shrink-0">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb justify-content-end mb-0">
            <li class="breadcrumb-item">
              <a href="{% url 'view_member' %}" class="btn btn-primary" style="color:#fff">View Member</a>
            </li>
          </ol>
        </nav>
      </div>
    </div>
    
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-header">
            <h4 class="card-title mb-0">Profile Information</h4>
          </div>
          <div class="card-body">  



<form action="" method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- BASIC DETAILS -->
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control"
                       name="name" value="{{ member.name|default:'' }}" required>
            </div>
        </div>

        <div class="col-md-6">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control"
                       name="email" value="{{ member.email|default:'' }}">
            </div>
        </div>
    </div>


    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" class="form-control"
                       name="phone" value="{{ member.phone|default:'' }}">
            </div>
        </div>

        <div class="col-md-6">
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control"
                       name="password" value="{{ member.password|default:'' }}">
            </div>
        </div>
    </div>  


    <!-- IMAGE -->
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label class="form-label">Upload Image</label>
                <input type="file" class="form-control"
                       name="imageUpload" accept="image/*">
                {% if member.image %}
                    <div class="mt-2">
                        <img src="{{ member.image.url }}"
                             width="120" class="rounded shadow-sm">
                    </div>
                {% endif %}
            </div>
        </div>

       <div class="col-md-6">
            <div class="mb-3">
                <label class="form-label">Select Company</label>
                <select name="company" class="form-control">
                    <option value="">Select Company</option>    
                    {% for c in companies %}
                        <option value="{{ c.id }}"
                            {% if member.company and member.company.id == c.id %}selected{% endif %}>
                            {{ c.name }}    
                        </option>
                    {% endfor %}
                </select>
            </div>  
        </div>   
    </div>



    <!-- SELF LOCATION -->
    <h5 class="mt-4">Self Location</h5>
    <div class="row">
        <div class="col-md-4">
            <label class="form-label">Country</label>
            <select class="form-control" id="country" name="country" required>
                <option value="">Select Country</option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label">State</label>
            <select class="form-control" id="state" name="state" required disabled>
                <option value="">Select State</option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label">City</label>
            <select class="form-control" id="city" name="city" required disabled>
                <option value="">Select City</option>
            </select>
        </div>
    </div>


    <div class="row mt-2">
        <div class="col-md-8">
            <label class="form-label">Address</label>
            <input type="text" class="form-control"
                   name="address" value="{{ member.address|default:'' }}">
        </div>

        <div class="col-md-4">
            <label class="form-label">Pincode</label>
            <input type="text" class="form-control"
                   name="pincode" value="{{ member.pincode|default:'' }}">
        </div>
    </div>



    <!-- PREFERRED LOCATION -->
    <h5 class="mt-4">Preferred Location</h5>

    <div class="row">
        <div class="col-md-4">
            <label class="form-label">Preferred Country</label>
            <select class="form-control" id="Pcountry" name="Pcountry">
                <option value="">Select Country</option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label">Preferred State</label>
            <select class="form-control" id="Pstate" name="Pstate" disabled>
                <option value="">Select State</option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label">Preferred City</label>
            <select class="form-control" id="Pcity" name="Pcity" disabled>
                <option value="">Select City</option>
            </select>
        </div>
    </div>


    <div class="row mt-2">
        <div class="col-md-8">
            <label class="form-label">Preferred Address</label>
            <input type="text" class="form-control"
                   name="Paddress" value="{{ member.Paddress|default:'' }}">
        </div>

        <div class="col-md-4">
            <label class="form-label">Preferred Pincode</label>
            <input type="text" class="form-control"
                   name="Ppincode" value="{{ member.Ppincode|default:'' }}">
        </div>
    </div>


    <!-- PROVIDER DETAILS -->
    <h5 class="mt-4">Provider Details</h5>

    <div class="row">
        <div class="col-md-6">
            <label class="form-label">Provider</label>
            <input type="text" class="form-control"
                   name="provider" value="{{ member.provider|default:'' }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">Provider ID</label>
            <input type="number" class="form-control"
                   name="provider_id" value="{{ member.provider_id|default:'' }}">
        </div>
    </div>


    <!-- SUBMIT -->
    <div class="mt-4">
        <button type="submit" class="btn btn-primary">
            {% if member %} Update {% else %} Submit {% endif %}
        </button>
    </div>

</form>

</div>
        </div>   
      </div>
    </div>
  </div>
</main>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const countrySelect = document.getElementById('country');
    const stateSelect = document.getElementById('state');
    const citySelect = document.getElementById('city');

    const API_BASE = 'https://api.countrystatecity.in/v1';
    const API_KEY = 'NHhvOEcyWk50N2Vna3VFTE00bFp3MjFKR0ZEOUhkZlg4RTk1MlJlaA=='; // Free API Key

    // --- Existing Member Values (for edit mode) ---
    const existingCountry = "{{ member.country|default:'' }}";
    const existingState = "{{ member.state|default:'' }}";
    const existingCity = "{{ member.city|default:'' }}";

    // Step 1: Load all countries
    loadCountries();

    function loadCountries() {
        fetch(`${API_BASE}/countries`, {
            headers: { 'X-CSCAPI-KEY': API_KEY }
        })
        .then(response => response.json())
        .then(data => {
            data.forEach(country => {
                const option = document.createElement('option');
                option.value = country.iso2;
                option.textContent = country.name;
                option.setAttribute('data-name', country.name);
                if (country.name === existingCountry) {
                    option.selected = true;
                }
                countrySelect.appendChild(option);
            });

            // If editing, and country exists, load states
            if (existingCountry) {
                const selectedCountry = data.find(c => c.name === existingCountry);
                if (selectedCountry) {
                    loadStates(selectedCountry.iso2, existingState, existingCity);
                }
            }
        })
        .catch(error => console.error('Error loading countries:', error));
    }

    // Step 2: Load states
    function loadStates(countryCode, preselectState = '', preselectCity = '') {
        stateSelect.innerHTML = '<option value="">Select State</option>';
        citySelect.innerHTML = '<option value="">Select City</option>';
        stateSelect.disabled = true;
        citySelect.disabled = true;

        fetch(`${API_BASE}/countries/${countryCode}/states`, {
            headers: { 'X-CSCAPI-KEY': API_KEY }
        })
        .then(response => response.json())
        .then(data => {
            if (data.length > 0) {
                stateSelect.disabled = false;
                data.forEach(state => {
                    const option = document.createElement('option');
                    option.value = state.iso2;
                    option.textContent = state.name;
                    option.setAttribute('data-name', state.name);
                    if (state.name === preselectState) {
                        option.selected = true;
                    }
                    stateSelect.appendChild(option);
                });

                // If editing, and state exists, load cities
                if (preselectState) {
                    const selectedState = data.find(s => s.name === preselectState);
                    if (selectedState) {
                        loadCities(countryCode, selectedState.iso2, preselectCity);
                    }
                }
            }
        })
        .catch(error => console.error('Error loading states:', error));
    }

    // Step 3: Load cities
    function loadCities(countryCode, stateCode, preselectCity = '') {
        citySelect.innerHTML = '<option value="">Select City</option>';
        citySelect.disabled = true;

        fetch(`${API_BASE}/countries/${countryCode}/states/${stateCode}/cities`, {
            headers: { 'X-CSCAPI-KEY': API_KEY }
        })
        .then(response => response.json())
        .then(data => {
            if (data.length > 0) {
                citySelect.disabled = false;
                data.forEach(city => {
                    const option = document.createElement('option');
                    option.value = city.name;
                    option.textContent = city.name;
                    if (city.name === preselectCity) {
                        option.selected = true;
                    }
                    citySelect.appendChild(option);
                });
            }
        })
        .catch(error => console.error('Error loading cities:', error));
    }

    // --- On change logic ---
    countrySelect.addEventListener('change', function() {
        const countryCode = this.value;
        const countryName = this.options[this.selectedIndex].getAttribute('data-name');
        
        if (countryCode) {
            setHiddenInput('country', countryName);
            loadStates(countryCode);
        } else {
            stateSelect.innerHTML = '<option value="">Select State</option>';
            citySelect.innerHTML = '<option value="">Select City</option>';
        }
    });

    stateSelect.addEventListener('change', function() {
        const stateCode = this.value;
        const stateName = this.options[this.selectedIndex].getAttribute('data-name');
        const countryCode = countrySelect.value;

        if (stateCode && countryCode) {
            setHiddenInput('state', stateName);
            loadCities(countryCode, stateCode);
        } else {
            citySelect.innerHTML = '<option value="">Select City</option>';
        }
    });

    citySelect.addEventListener('change', function() {
        const cityName = this.value;
        setHiddenInput('city', cityName);
    });

    // Utility: maintain hidden input for correct name binding
    function setHiddenInput(fieldName, value) {
        let input = document.getElementById(fieldName + '_hidden');
        if (!input) {
            input = document.createElement('input');
            input.type = 'hidden';
            input.name = fieldName;
            input.id = fieldName + '_hidden';
            document.querySelector('form').appendChild(input);
        }
        input.value = value;
    }

    // --- Sub Admin Role Management (unchanged) ---
    const subAdminCheckbox = document.getElementById('role_subadmin');
    const roleCheckboxes = document.querySelectorAll('.role-checkbox');

    if (subAdminCheckbox.checked) disableOtherRoles();

    subAdminCheckbox.addEventListener('change', function() {
        if (this.checked) disableOtherRoles();
        else enableOtherRoles();
    });

    function disableOtherRoles() {
        roleCheckboxes.forEach(checkbox => {
            checkbox.checked = false;
            checkbox.disabled = true;
            checkbox.parentElement.style.opacity = '0.5';
        });
    }

    function enableOtherRoles() {
        roleCheckboxes.forEach(checkbox => {
            checkbox.disabled = false;
            checkbox.parentElement.style.opacity = '1';
        });
    }
});
</script>

    PcitySelect.addEventListener('change', function() {

    // Hidden input handler
    function setHiddenPreferred(field, value) {

{% endblock content %}
