{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Holiday Property</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        #map {
            height: 350px;
            width: 100%;
        }

        .suggest-box {
            position: absolute;
            width: 100%;
            background: white;
            border: 1px solid #ddd;
            z-index: 50;
        }

        .suggest-item {
            padding: 8px;
            cursor: pointer;
        }

        .suggest-item:hover {
            background: #f3f3f3;
        }
    </style>

    <!-- GOOGLE MAPS API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_API&libraries=places"></script>

</head>

<body class="bg-gray-100">

    <div class="max-w-6xl mx-auto bg-white shadow-lg rounded-xl p-8 my-10">

        <h2 class="text-3xl font-bold mb-6">Create Holiday Property</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- ===================== BASIC ============================ -->
            <h3 class="font-semibold text-xl mb-3">Basic Details</h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <div>
                    <label>Property Title</label>
                    <input type="text" name="title" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label>Property Type</label>
                    <select name="subproperty_type" class="w-full border p-2 rounded">
                        <option value="">Select</option>  
                        <option>Villa</option>
                        <option>Farm House</option>
                        <option>Resort Room</option>
                        <option>Holiday Home</option>
                    </select>
                </div>

                <div>
                    <label>Listing Type</label>
                    <select name="listing_type" class="w-full border p-2 rounded">
                        <option value="">Select</option>
                        <option value="rent">Rent</option>
                        <option value="sell">Sell</option>
                    </select>
                </div>

                <div>
                    <label>Price</label>
                    <input type="number" name="price" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label>Price Type</label>
                    <select name="price_type" class="w-full border p-2 rounded">
                        <option value="">Select</option>
                        <option value="daily">Daily</option>
                        <option value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                    </select>
                </div>

                <div>
                    <label>Available From</label>
                    <input type="date" name="available_from" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label>Available To</label>
                    <input type="date" name="available_to" class="w-full border p-2 rounded">
                </div>

            </div>

            <div class="mt-4">
                <label>Description</label>
                <textarea name="description" class="w-full border p-2 rounded" rows="3"></textarea>
            </div>

             <div>
              <select name="company" class="form-control">
                 <option value="">Select Company</option>
              {% for c in company %}
                <option value="{{ c.id }}">{{ c.name }}</option>
              {% endfor %}
              </select>  
            </div>   

            <!-- Property Type -->
        <div class="mb-3">
            <label class="form-label">Property Type</label>
            <select name="property_type" class="form-select">    
                {% for type in property_types %}  
                    <option value="{{ type.id }}">{{ type.name }}</option>  
                {% endfor %}  
            </select>
        </div>        

           <!-- LOCATION -->
        <h2 class="text-xl font-semibold mt-6 mb-3">Step 2: Location</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

            <div>
                <label class="font-medium">Country</label>
                <select id="country" name="country" class="w-full border p-2 rounded"></select>  
            </div>

            <div>
                <label class="font-medium">State</label>  
                <select id="state" name="state" class="w-full border p-2 rounded"></select>
            </div>

            <div>  
                <label class="font-medium">City</label>
                <select id="city" name="city" class="w-full border p-2 rounded"></select>
            </div>

            <div class="relative">
                <label class="font-medium">Locality</label>
                <input type="text" id="locality" name="locality" class="border px-3 py-2 rounded-lg w-full">
                <div id="locality_suggest" class="absolute left-0 right-0 bg-white border rounded-lg shadow hidden suggest-box z-10"></div>
            </div>

            <div>
                <label class="font-medium">Landmark</label>
                <input type="text" name="landmark" class="border px-3 py-2 rounded-lg w-full">
            </div>

            <div>
                <label class="font-medium">Pincode</label>
                <input type="text" name="pincode" class="border px-3 py-2 rounded-lg w-full">
            </div>

        </div>

        <!-- MAP -->
        <div class="mt-4">
            <label class="font-medium">Select Location on Map</label>
            <div id="map"></div>  

            <input type="hidden" name="latitude" id="lat">
            <input type="hidden" name="longitude" id="lng">
        </div>
        
  <!-- LAT / LNG -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">

    <!-- Latitude -->
    <div>
        <label class="font-medium">Latitude</label>
        <div class="flex mt-1">
            <input 
                type="text"
                id="latitude"
                name="latitude"
                class="border rounded-l-lg px-3 py-2 w-full"
                placeholder="Enter latitude"
            >
            <button 
                type="button"
                id="setLatLng"
                class="border border-blue-600 text-blue-600 px-4 rounded-r-lg"
            >
                Set
            </button>
        </div>
    </div>

    <!-- Longitude -->
    <div>
        <label class="font-medium">Longitude</label>
        <div class="flex mt-1">
            <input 
                type="text"
                id="longitude"
                name="longitude"
                class="border rounded-l-lg px-3 py-2 w-full"
                placeholder="Enter longitude"
            >
            <button 
                type="button"
                id="getCurrentLocation"
                class="border border-green-600 text-green-600 px-4 rounded-r-lg"
            >
                Current
            </button>
        </div>
    </div>

</div>

<!-- Selected Address -->
<div class="mt-6">
    <label class="font-medium">Selected Address</label>
    <input 
        type="text"
        id="address"
        name="address"
        class="border rounded-lg px-3 py-2 mt-1 w-full"
        placeholder="Address will appear here"
    >
</div>         




  


            <!-- ===================== SPECIFICATIONS ============================ -->
            <h3 class="font-semibold text-xl mt-10 mb-3">Property Specifications</h3>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                <div>
                    <label>Bedrooms</label>
                    <input type="number" name="bedrooms" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label>Bathrooms</label>
                    <input type="number" name="bathrooms" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label>Balconies</label>
                    <input type="number" name="balconies" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label>Built-up Area</label>
                    <input type="text" name="builtup_area" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label>Carpet Area</label>
                    <input type="text" name="carpet_area" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label>Plot Area</label>
                    <input type="text" name="plot_area" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label>Furnishing</label>
                    <select name="furnishing" class="w-full border p-2 rounded">
                        <option value="">Select</option>
                        <option>Fully Furnished</option>
                        <option>Semi Furnished</option>
                        <option>Unfurnished</option>
                    </select>
                </div>

                <div>
                    <label>Floor Number</label>
                    <input type="text" name="floor_number" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label>Total Floors</label>
                    <input type="text" name="total_floors" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label>Parking Spaces</label>
                    <input type="text" name="parking_spaces" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label>Facing Direction</label>
                    <input type="text" name="facing_direction" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label>Property Age</label>
                    <input type="text" name="property_age" class="w-full border p-2 rounded">
                </div>

            </div>



            <!-- ===================== NEARBY ============================ -->
            <h3 class="font-semibold text-xl mt-10 mb-3">Nearby</h3>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">

                <div>
                    <label>Beach (km)</label>
                    <input type="number" name="beach_distance" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label>Market (km)</label>
                    <input type="number" name="market_distance" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label>Restaurant (km)</label>
                    <input type="number" name="restaurant_distance" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label>Airport (km)</label>
                    <input type="number" name="airport_distance" class="w-full border p-2 rounded">
                </div>

            </div>



            <!-- ===================== AMENITIES ============================ -->
            <h3 class="font-semibold text-xl mt-10 mb-3">Amenities</h3>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                {% for a in amenities %}
                <label class="flex items-center gap-2">
                    <input type="checkbox" name="amenities" value="{{ a.id }}">
                    {{ a.name }}
                </label>
                {% endfor %}
            </div>



            <!-- ===================== OWNER ============================ -->
            <h3 class="font-semibold text-xl mt-10 mb-3">Owner / Agent</h3>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                <div>
                    <label>Listed By</label>
                    <select name="listed_by" class="w-full border p-2 rounded">
                        <option value="">Select</option>
                        <option>Owner</option>
                        <option>Agent</option>
                        <option>Builder</option>
                    </select>
                </div>

                <div>
                    <label>Owner Name</label>
                    <input type="text" name="owner_name" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label>Contact Number</label>
                    <input type="text" name="contact_number" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label>Email</label>
                    <input type="email" name="email" class="w-full border p-2 rounded">
                </div>

                <div>
                    <label>Profile Photo</label>
                    <input type="file" name="profile_photo" class="w-full border p-2 rounded">
                </div>

            </div>



            <!-- ===================== MEDIA ============================ -->  
            <h3 class="font-semibold text-xl mt-10 mb-3">Media Upload</h3>

            <!-- IMAGES -->
        <h2 class="text-xl font-semibold mt-6 mb-3">Images</h2>

        <label class="border-2 border-dashed rounded-lg p-6 text-center cursor-pointer block">
            <div class="text-4xl text-gray-400">+</div>
            <p class="text-gray-600">Click to upload images</p>
            <input type="file" name="images" multiple class="hidden">  
        </label>

        <!-- 360 images -->
        <h2 class="text-xl font-semibold mt-6 mb-3">360° Images</h2>

        <label class="border-2 border-dashed rounded-lg p-6 text-center cursor-pointer block">
            <div class="text-4xl text-gray-400">🌀</div>
            <p class="text-gray-600">Upload 360° Images</p>
            <input type="file" name="images_360" multiple class="hidden">  
        </label>    

        <!-- VIDEO -->
        <h2 class="text-xl font-semibold mt-6 mb-3">Video (Optional)</h2>

        <label class="border-2 border-dashed rounded-lg p-6 text-center cursor-pointer block">
            <div class="text-4xl text-gray-400">🎥</div>
            <p class="text-gray-600">Click to upload video</p>
            <input type="file" name="video_file" class="hidden">  
        </label>

        <div class="mt-3">
            <label class="font-medium">Video URL</label>
            <input type="url" name="video_url" class="border px-3 py-2 rounded-lg w-full">
        </div>  



            <!-- ===================== SEO ============================ -->
            <h3 class="font-semibold text-xl mt-10 mb-3">SEO</h3>

            <div>
                <label>Meta Title</label>
                <input type="text" name="meta_title" class="w-full border p-2 rounded">
            </div>

            <div class="mt-3">
                <label>Meta Description</label>
                <textarea name="meta_description" rows="3" class="w-full border p-2 rounded"></textarea>
            </div>

            <div class="mt-3">
                <label>Tags (comma separated)</label>
                <input type="text" name="tags" class="w-full border p-2 rounded">
            </div>

            <div class="mt-3 flex items-center gap-2">
                <input type="checkbox" name="featured">
                <label>Featured Property</label>
            </div>



            <!-- ===================== SUBMIT ============================ -->

            <div class="mt-10">
                <button class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700">
                    Create Property
                </button>
            </div>

        </form>

    </div>


<!-- JS -->
<script>   


    
        /* ------------------- COUNTRY / STATE / CITY ------------------- */
        const country = document.getElementById("country");
        const state = document.getElementById("state");
        const city = document.getElementById("city");

        country.innerHTML = `<option>Loading...</option>`;

        fetch("https://countriesnow.space/api/v0.1/countries")
            .then(r => r.json())
            .then(data => {
                country.innerHTML = `<option value="">Select Country</option>`;
                data.data.forEach(c => {
                    country.innerHTML += `<option value="${c.country}">${c.country}</option>`;
                });
            });

        country.addEventListener("change", () => {
            state.innerHTML = `<option>Loading...</option>`;

            fetch("https://countriesnow.space/api/v0.1/countries/states", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ country: country.value })
            })
                .then(r => r.json())
                .then(data => {
                    state.innerHTML = `<option value="">Select State</option>`;
                    data.data.states.forEach(s => {
                        state.innerHTML += `<option value="${s.name}">${s.name}</option>`;
                    });
                });
        });

        state.addEventListener("change", () => {
            city.innerHTML = `<option>Loading...</option>`;

            fetch("https://countriesnow.space/api/v0.1/countries/state/cities", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    country: country.value,
                    state: state.value
                })
            })
                .then(r => r.json())
                .then(data => {
                    city.innerHTML = `<option value="">Select City</option>`;
                    data.data.forEach(ct => {
                        city.innerHTML += `<option value="${ct}">${ct}</option>`;
                    });
                });
        });  



    // 🌍 MAP INIT
    var map = L.map('map').setView([20.5937, 78.9629], 5);  // India Center

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
    }).addTo(map);

    var marker;

    map.on("click", function(e) {
        let lat = e.latlng.lat;
        let lng = e.latlng.lng;

        document.getElementById("lat").value = lat;
        document.getElementById("lng").value = lng;

        if (marker) map.removeLayer(marker);

        marker = L.marker([lat, lng]).addTo(map);
    });


    // 🔍 Locality Suggestion
    document.getElementById("locality").addEventListener("input", function() {
        let val = this.value;

        if (val.length < 3) {
            document.getElementById("locality_suggest").classList.add("hidden");
            return;
        }

        fetch(`/location/search/?q=${val}`)
            .then(res => res.json())
            .then(data => {
                let box = document.getElementById("locality_suggest");
                box.innerHTML = "";

                data.cities.forEach(city => {
                    let div = document.createElement("div");
                    div.className = "p-2 hover:bg-gray-100 cursor-pointer";
                    div.innerText = city;
                    div.onclick = () => {
                        document.getElementById("locality").value = city;
                        box.classList.add("hidden");
                    };
                    box.appendChild(div);
                });

                box.classList.remove("hidden");
            });
    });    
</script>
      

</body>

</html>
