<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">     
  <title>Add Role</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    /* ✅ SUCCESS */
.alert-success-custom {
    background: #d1f7d6;
    color: #0b6e20;
    border-left: 6px solid #28a745;
}

/* ✅ ERROR */
.alert-error-custom {
    background: #ffd3d3;
    color: #a10000;
    border-left: 6px solid #dc3545;
}

/* ✅ WARNING */
.alert-warning-custom {
    background: #fff3cd;
    color: #a17b00;
    border-left: 6px solid #ffc107;
}

/* ✅ INFO */
.alert-info-custom {
    background: #d6ecff;
    color: #005c99;
    border-left: 6px solid #0dcaf0;  
}

  </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
 
  <br> 
  <div class="bg-white p-6 rounded-xl shadow-md w-96">
       
    <h2 class="text-xl font-semibold mb-4 text-center">Add New Role</h2>

   {% if messages %}
<div class="container-fluid my-3">
    {% for message in messages %}
    
    <div class="
        alert 
        alert-dismissible 
        fade show 
        py-3 px-4 shadow-sm border-0 rounded-3
        {% if message.tags == 'success' %} alert-success-custom {% endif %}
        {% if message.tags == 'error' %} alert-error-custom {% endif %}
        {% if message.tags == 'warning' %} alert-warning-custom {% endif %}
        {% if message.tags == 'info' %} alert-info-custom {% endif %}  
    " role="alert">

        <span class="fw-semibold">
            {{ message }}
        </span>

        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    {% endfor %}
</div>
{% endif %}  
  

    <form method="POST" class="space-y-4">
    {% csrf_token %}
    
    <label for="role" class="block text-gray-700 font-medium">Enter Role</label>
    <input 
        type="text" 
        name="role" 
        id="role"
        placeholder="Enter Role"
        class="w-full border rounded-lg p-2"
        required
    >

    <button type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
        Add Role
    </button>
</form>    


    <hr class="my-4">

    <h3 class="text-lg font-semibold mb-2">Existing Roles</h3>
    <ul class="list-disc ml-5">
      {% for r in roles %}
        <li>{{ r.role }}</li>
      {% empty %}
        <li>No roles found.</li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
